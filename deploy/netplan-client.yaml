# deploy/netplan-client.yaml — client Pi (ben-desktop), demo-plane ethernet.
# Identical to the server config but with 10.0.0.1 (the client owns .1).
#
# VERIFY the interface name first:  ip link   (usually eth0, but confirm).
# These Pis run Ubuntu DESKTOP (NetworkManager renderer) — detect with: nmcli -v.
#
# Apply:
#   sudo cp deploy/netplan-client.yaml /etc/netplan/99-demo-link.yaml
#   sudo netplan apply
#   ping 10.0.0.2     # from the client, should reach the server
network:
  version: 2
  renderer: NetworkManager  # Ubuntu Desktop. Use networkd if Server.
  ethernets:
    eth0:                   # <-- replace with the verified interface name
      dhcp4: no
      addresses: [10.0.0.1/24]
      # intentionally no gateway/routes — this link is point-to-point.
