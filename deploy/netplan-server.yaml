# deploy/netplan-server.yaml — server Pi (qianpi-desktop), demo-plane ethernet.
# Direct point-to-point link to the client Pi. No gateway/routes (PROJECT_PLAN.md §8).
#
# The server is 10.0.0.2 (matches the verified working hardware and
# protocol/suite.conf server_addr). The client Pi is 10.0.0.1.
#
# VERIFY the interface name first:  ip link   (usually eth0, but confirm).
# These Pis run Ubuntu DESKTOP (NetworkManager renderer) — detect with: nmcli -v.
#
# Apply:
#   sudo cp deploy/netplan-server.yaml /etc/netplan/99-demo-link.yaml
#   sudo netplan apply
#   ping 10.0.0.1     # from the server, should reach the client
network:
  version: 2
  renderer: NetworkManager  # Ubuntu Desktop. Use networkd if Server.
  ethernets:
    eth0:                   # <-- replace with the verified interface name
      dhcp4: no
      addresses: [10.0.0.2/24]
      # intentionally no gateway/routes — this link is point-to-point.
