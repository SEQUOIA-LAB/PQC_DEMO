# protocol/suite.conf — THE SHARED WIRE CONTRACT (single source of truth)
#
# Both the server and the client roles read this file. Changing the crypto for
# the demo means editing this file and nothing else. TLS fails closed on any
# mismatch, so the two ends MUST derive their parameters from here.
#
# Consumed by app/config.py -> loaded into both server/ and client/.
# Values use the FIPS / OpenSSL 3.5 names. Do NOT use legacy names
# (Kyber / Dilithium / SPHINCS+) anywhere.

[demo]
# TLS protocol version. Pinned to 1.3 — PQC groups require it.
tls_version = TLSv1.3

# Key-exchange group. Hybrid X25519 + ML-KEM-768 (FIPS 203).
# This is the OpenSSL 3.5 default TLS 1.3 group; we pin it explicitly anyway.
group = X25519MLKEM768

# Certificate signature algorithm. ML-DSA-65 (FIPS 204).
sig_alg = ML-DSA-65

# AEAD cipher suite for the TLS record layer (TLS 1.3 ciphersuite name).
# Our app-layer message wrapper (app/) uses the same AEAD primitive so the
# instrumented path matches the transport.
ciphersuite = TLS_AES_256_GCM_SHA384

# App-layer AEAD (used by app/ for the custom-message frame, see
# protocol/message_format.md). Independent of the TLS record AEAD but chosen
# to match for credibility. AES-256-GCM, 96-bit nonce, 128-bit tag.
app_aead = AES-256-GCM
app_aead_key_bits = 256
app_aead_nonce_bytes = 12
app_aead_tag_bytes = 16

[net]
# Demo plane. On the Pis this is the direct ethernet link (see deploy/).
# Locally these are overridden to 127.0.0.1 by the role entrypoints.
# Server is 10.0.0.2 (qianpi-desktop), client is 10.0.0.1 (ben-desktop) — this
# is the verified working hardware topology. The roles' --host defaults to this.
server_addr = 10.0.0.2
server_port = 4433

[demo_run]
# Fixed shared salt so BOTH Pis derive the same app-layer AEAD key from a plain
# `git pull` — no manual coordination on demo day (app/aead.py, message_format.md).
# This salt only seeds the INSTRUMENTATION layer; the PQC-TLS channel itself
# provides the real confidentiality/authentication. Both roles default --salt to
# this value; override with --salt on the CLI for an ad-hoc run.
salt = 504f5143444d4f2d44454d4f2d76312d73616c74
# Default message the client sends when none is given (demo-day auto-send).
default_message = hello from a post-quantum world

[certs]
# Relative to repo root. Generated by app/gen_certs.py using sig_alg above.
ca_cert   = certs/ca.crt
server_cert = certs/server.crt
server_key  = certs/server.key
